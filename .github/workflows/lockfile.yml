name: Generate lockfile

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock.json and add build script
        run: |
          DIR=.
          if [ -f ping-video-chat/package.json ]; then DIR=ping-video-chat; fi
          cd "$DIR"
          npm pkg set scripts.build="echo no build step"
          npm install --package-lock-only
          echo "Project folder: $DIR"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add package-lock.json and build script"
          git push
